name: Build Windows exe

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Download sensor helpers (LibreHardwareMonitor + PawnIO driver)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./get_vendor.ps1

      - name: Build exe
        run: >
          pyinstaller --onefile --noconsole --name PCMonitorWidget
          --add-data "vendor;vendor"
          --hidden-import wmi --hidden-import pythoncom --hidden-import win32com.client
          pc_widget.py

      - name: Upload build as artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCMonitorWidget
          path: dist/PCMonitorWidget.exe

      - name: Attach exe to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PCMonitorWidget.exe
          generate_release_notes: true
